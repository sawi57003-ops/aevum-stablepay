[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Deploy script writes the deployment record + UI config.
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read-write", path = "./app" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
